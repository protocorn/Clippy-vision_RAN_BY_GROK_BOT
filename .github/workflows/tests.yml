name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      
      - name: List installed packages
        run: pip list
      
      - name: Run tests with explicit skips
        run: |
          # Skip tests that require:
          # - GUI/display (Electron, X11, Wayland)
          # - Ollama server running
          # - Platform-specific APIs (uiautomation on Windows, pyobjc on macOS)
          # - System integrations not available in CI
          
          # On Ubuntu: skip Windows-only tests (UI Automation)
          # On Windows: skip macOS-only tests (AX APIs, AppleScript)
          # On both: skip GUI, Ollama, system integration tests
          
          pytest tests/ -v \
            --deselect=tests/test_mcp_server.py \
            --deselect=tests/test_accessibility_text.py \
            --deselect=tests/test_editor_accessibility.py \
            --deselect=tests/test_mac_redaction.py \
            --deselect=tests/test_intro_builder.py
        shell: bash
      
      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Explicitly Skipped Test Files" >> $GITHUB_STEP_SUMMARY
          echo "- test_mcp_server.py - requires running Ollama server and MCP client" >> $GITHUB_STEP_SUMMARY
          echo "- test_accessibility_text.py - requires Windows UI Automation or macOS AX APIs" >> $GITHUB_STEP_SUMMARY
          echo "- test_editor_accessibility.py - requires running VS Code/Cursor with accessibility enabled" >> $GITHUB_STEP_SUMMARY
          echo "- test_mac_redaction.py - requires macOS with AppleScript" >> $GITHUB_STEP_SUMMARY
          echo "- test_intro_builder.py - requires full app setup and LLM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All other tests must pass for CI to succeed." >> $GITHUB_STEP_SUMMARY
        shell: bash
