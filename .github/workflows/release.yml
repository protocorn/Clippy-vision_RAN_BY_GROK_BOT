name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'electron-ui/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.0.1). Leave empty for dry-run without creating a release.'
        required: false
      include_macos:
        description: 'Also build unsigned macOS installers (opt-in, manual validation required)'
        type: boolean
        default: false
      include_linux:
        description: 'Build Linux AppImage (enabled by default for tag pushes)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Checkout the ref the workflow was triggered on (tag push or dispatch branch),
      # not the release tag input — so workflow_dispatch from main builds current packaging.
      # lfs: true pulls any remaining Git LFS objects. Model weights are downloaded, not committed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Sync app version from release tag or dry-run
        working-directory: electron-ui
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Dry-run: use package.json version with -dev suffix
            TAG="v$(node -p "require('./package.json').version")-dev+${{ github.sha }}"
            echo "::notice::Dry-run build (no release will be created): $TAG"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "Invalid version derived from tag '$TAG' (got '$VERSION')"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building Clippy Vision $VERSION (release tag $TAG)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build Windows installer (unsigned)
        working-directory: electron-ui
        run: npm run dist:win

      - name: Smoke check Windows installer
        shell: bash
        working-directory: electron-ui/dist
        run: |
          echo "Checking Windows installer..."
          INSTALLER=$(ls ClippyVision-Windows-Setup-*.exe 2>/dev/null | head -1)
          if [[ -z "$INSTALLER" ]]; then
            echo "ERROR: No Windows installer found"
            exit 1
          fi
          SIZE=$(stat -c%s "$INSTALLER" 2>/dev/null || stat -f%z "$INSTALLER" 2>/dev/null)
          echo "Found: $INSTALLER (${SIZE} bytes)"
          if [[ $SIZE -lt 50000000 ]]; then
            echo "ERROR: Installer too small (${SIZE} bytes, expected >50MB)"
            exit 1
          fi
          echo "✓ Windows installer OK"

      - name: Silent install test Windows
        shell: pwsh
        working-directory: electron-ui/dist
        run: |
          Write-Host "=== Installing Python 3.11 and dependencies ==="
          
          # Install Python 3.11
          Write-Host "Installing Python 3.11..."
          $pythonInstaller = "python-3.11.9-amd64.exe"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/$pythonInstaller" -OutFile $pythonInstaller
          Start-Process -FilePath $pythonInstaller -ArgumentList "/quiet", "InstallAllUsers=0", "PrependPath=1" -Wait -NoNewWindow
          
          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          # Verify Python installation
          $pythonExe = "python"
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python installation failed"
            exit 1
          }
          
          # Install requirements
          Write-Host "Installing Python dependencies..."
          & $pythonExe -m pip install --upgrade pip
          & $pythonExe -m pip install -r ..\..\requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to install Python dependencies"
            exit 1
          }
          
          Write-Host "=== Running silent installation ==="
          $installer = Get-ChildItem -Filter "ClippyVision-Windows-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer found"
            exit 1
          }
          
          Write-Host "Installing: $($installer.Name)"
          $installLog = "install-test.log"
          
          # Run silent install
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -NoNewWindow
          
          Write-Host "Checking installation..."
          $programFiles = ${env:ProgramFiles}
          $installPath = "$programFiles\Clippy Vision"
          $exePath = "$installPath\Clippy Vision.exe"
          
          # Also check local app data (user install)
          $localAppData = ${env:LOCALAPPDATA}
          $localInstallPath = "$localAppData\Programs\Clippy Vision"
          $localExePath = "$localInstallPath\Clippy Vision.exe"
          
          $installedExe = $null
          $installLocation = ""
          if (Test-Path $exePath) {
            $installedExe = $exePath
            $installLocation = "Program Files"
            Write-Host "✓ Installation successful (Program Files): $exePath"
          } elseif (Test-Path $localExePath) {
            $installedExe = $localExePath
            $installLocation = "LocalAppData\Programs"
            Write-Host "✓ Installation successful (LocalAppData\Programs): $localExePath"
          } else {
            Write-Error "Installation failed - executable not found at either location:"
            Write-Error "  - $exePath"
            Write-Error "  - $localExePath"
            "Installation failed - exe not found" | Out-File $installLog
            exit 1
          }
          
          $exeSize = (Get-Item $installedExe).Length
          Write-Host "  Installed exe size: $exeSize bytes"
          Write-Host "  Install location: $installLocation"
          
          # Pre-seed setup to bypass wizard
          Write-Host "Pre-seeding setup configuration..."
          $appDataDir = "$localAppData\Clippy Vision\data"
          New-Item -Path $appDataDir -ItemType Directory -Force | Out-Null
          
          # Create setup_complete.json
          $setupComplete = @{
            version = "2.1.0"
            completedAt = (Get-Date).ToUniversalTime().ToString("o")
          }
          $setupComplete | ConvertTo-Json | Out-File "$appDataDir\setup_complete.json" -Encoding UTF8
          
          # Create llm_config.json with stub HTTP endpoint (bypass Ollama requirement)
          # The backend preflight will check this URL instead of requiring Ollama
          $llmConfig = @{
            provider = "ollama"
            base_url = "http://127.0.0.1:11555"
            api_key = ""
            chat_model = "test-model"
            embedding_model = "nomic-embed-text"
          }
          $llmConfig | ConvertTo-Json | Out-File "$appDataDir\llm_config.json" -Encoding UTF8
          
          # Start a minimal stub server on 11555 to satisfy preflight checks
          Write-Host "Starting stub LLM API server on port 11555..."
          $stubServer = Start-Job -ScriptBlock {
            $listener = New-Object System.Net.HttpListener
            $listener.Prefixes.Add("http://127.0.0.1:11555/")
            $listener.Start()
            Write-Host "Stub server listening on http://127.0.0.1:11555/"
            while ($listener.IsListening) {
              $context = $listener.GetContext()
              $response = $context.Response
              $response.StatusCode = 200
              $response.ContentType = "application/json"
              $buffer = [System.Text.Encoding]::UTF8.GetBytes('{"status":"ok"}')
              $response.ContentLength64 = $buffer.Length
              $response.OutputStream.Write($buffer, 0, $buffer.Length)
              $response.OutputStream.Close()
            }
          }
          Start-Sleep -Seconds 2
          
          Write-Host "✓ Setup pre-seeded (bypasses wizard, stub LLM API on 11555)"
          
          # Launch test (60 seconds with HTTP check)
          Write-Host "Launching application (60 second test with HTTP backend check)..."
          $launchLog = "$localInstallPath\launch-test.log"
          
          $process = Start-Process -FilePath $installedExe -PassThru -WindowStyle Hidden -RedirectStandardOutput $launchLog -RedirectStandardError "$launchLog.err" -ErrorAction Stop
          
          if (-not $process) {
            Write-Error "Failed to start process"
            "Launch failed" | Out-File $installLog
            exit 1
          }
          
          Write-Host "  Main process PID: $($process.Id)"
          
          # Parse backend port from log
          $backendPort = $null
          $backendHttpOk = $false
          
          # Monitor for 60 seconds
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 1
            
            # Check if main process exited
            if ($process.HasExited) {
              Write-Error "Process exited after $i seconds (exit code: $($process.ExitCode))"
              "Process crashed after ${i}s (code: $($process.ExitCode))" | Out-File $installLog
              if (Test-Path $launchLog) {
                Get-Content $launchLog | Write-Host
              }
              exit 1
            }
            
            # Try to read port from log
            if (($null -eq $backendPort) -and (Test-Path $launchLog)) {
              $logContent = Get-Content $launchLog -Raw -ErrorAction SilentlyContinue
              if ($logContent -match '\[api\] port=(\d+)') {
                $backendPort = $matches[1]
                Write-Host "✓ Backend port announced: $backendPort at ${i}s"
              }
            }
            
          # Try HTTP health check if port known
          if (($null -ne $backendPort) -and (-not $backendHttpOk)) {
            foreach ($hostAddr in @("127.0.0.1", "localhost")) {
              try {
                $response = Invoke-WebRequest -Uri "http://${hostAddr}:${backendPort}/health" -TimeoutSec 2 -UseBasicParsing -ErrorAction SilentlyContinue
                if ($response.StatusCode -eq 200) {
                  $backendHttpOk = $true
                  Write-Host "✓ Backend HTTP responding on ${hostAddr}:${backendPort} at ${i}s"
                  Write-Host "  Response: $($response.Content)"
                  break
                }
              } catch {
                # Connection failed, continue
              }
            }
          }
            
            # Show progress every 10 seconds
            if ($i % 10 -eq 0) {
              Write-Host "  ...${i}s elapsed (process alive, backend HTTP: $(if ($backendHttpOk) {'OK'} else {'not yet'}))"
            }
          }
          
          Write-Host "✓ Process still running after 60 seconds"
          
          # Stop stub server
          Stop-Job -Job $stubServer -ErrorAction SilentlyContinue
          Remove-Job -Job $stubServer -ErrorAction SilentlyContinue
          
          # Verify backend status - FAIL HARD if HTTP check never succeeded
          if ($null -eq $backendPort) {
            Write-Error "ERROR: Backend port was never announced in logs"
            Write-Host "=== Launch log ==="
            if (Test-Path $launchLog) {
              Get-Content $launchLog | Write-Host
            }
            if (Test-Path "$launchLog.err") {
              Write-Host "=== Backend stderr ==="
              Get-Content "$launchLog.err" | Write-Host
            }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          } elseif (-not $backendHttpOk) {
            Write-Error "ERROR: Backend HTTP health check FAILED"
            Write-Error "  Port announced: $backendPort"
            Write-Error "  HTTP /health never returned 200 OK"
            Write-Host "=== Launch log ==="
            if (Test-Path $launchLog) {
              Get-Content $launchLog | Write-Host
            }
            if (Test-Path "$launchLog.err") {
              Write-Host "=== Backend stderr ==="
              Get-Content "$launchLog.err" | Write-Host
            }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          } else {
            Write-Host "✓ Backend HTTP health check PASSED"
          }
          
          # Cleanup
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          
          # Write summary
          "Installation: $installLocation" | Out-File $installLog
          "Process ran for 60 seconds" | Out-File $installLog -Append
          "Backend port: $(if ($null -ne $backendPort) {$backendPort} else {'not announced'})" | Out-File $installLog -Append
          "Backend HTTP: $(if ($backendHttpOk) {'PASS'} else {'FAIL or not reached'})" | Out-File $installLog -Append
          
          Write-Host ""
          Write-Host "✓ Silent install test completed"
          Write-Host "  - Installed to: $installLocation"
          Write-Host "  - Process stable for 60s"
          Write-Host "  - Backend port: $(if ($null -ne $backendPort) {$backendPort} else {'not announced'})"
          Write-Host "  - Backend HTTP: $(if ($backendHttpOk) {'PASS (200 OK)'} else {'FAIL or not reached'})"

      - name: Upload Windows test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-test
          path: |
            electron-ui/dist/install-test.log
          retention-days: 14

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron-ui/dist/*.exe
          retention-days: 14

      - name: Upload Windows installer to release
        # Only upload to release if we have a tag (not a dry-run or PR)
        if: (github.event.inputs.tag != '' || github.ref_type == 'tag') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            electron-ui/dist/*.exe
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opt-in only. Tag pushes never build or publish macOS installers.
  build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Sync app version from release tag or dry-run
        working-directory: electron-ui
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            # Dry-run: use package.json version with -dev suffix
            TAG="v$(node -p "require('./package.json').version")-dev+${{ github.sha }}"
            echo "::notice::Dry-run build (no release will be created): $TAG"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "Invalid version derived from tag '$TAG' (got '$VERSION')"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building Clippy Vision $VERSION (release tag $TAG)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build macOS installer (unsigned, code signing disabled)
        working-directory: electron-ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload macOS installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: electron-ui/dist/*.dmg
          retention-days: 14

      - name: Upload macOS installers to release
        # Only upload to release if we have a tag (not a dry-run or PR)
        if: github.event.inputs.tag != '' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            electron-ui/dist/*.dmg
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    # Run on tag pushes, PRs (dry-run), or on workflow_dispatch if include_linux is true (default)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.include_linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Sync app version from release tag or dry-run
        working-directory: electron-ui
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Dry-run: use package.json version with -dev suffix
            TAG="v$(node -p "require('./package.json').version")-dev+${{ github.sha }}"
            echo "::notice::Dry-run build (no release will be created): $TAG"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "Invalid version derived from tag '$TAG' (got '$VERSION')"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building Clippy Vision $VERSION (release tag $TAG)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build Linux AppImage (unsigned)
        working-directory: electron-ui
        run: npm run dist:linux

      - name: Smoke check Linux AppImage
        working-directory: electron-ui/dist
        run: |
          echo "Checking Linux AppImage..."
          APPIMAGE=$(ls ClippyVision-Linux-*.AppImage 2>/dev/null | head -1)
          if [[ -z "$APPIMAGE" ]]; then
            echo "ERROR: No AppImage found"
            exit 1
          fi
          SIZE=$(stat -c%s "$APPIMAGE")
          echo "Found: $APPIMAGE (${SIZE} bytes)"
          if [[ $SIZE -lt 50000000 ]]; then
            echo "ERROR: AppImage too small (${SIZE} bytes, expected >50MB)"
            exit 1
          fi
          
          # Extract and verify main binary exists
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract >/dev/null 2>&1
          
          if [[ ! -f "squashfs-root/clippy-vision" ]] && [[ ! -f "squashfs-root/AppRun" ]]; then
            echo "ERROR: Main binary not found in extracted AppImage"
            ls -la squashfs-root/ || true
            exit 1
          fi
          
          echo "✓ AppImage structure OK"
          rm -rf squashfs-root

      - name: Launch test Linux AppImage under Xvfb
        working-directory: electron-ui/dist
        run: |
          echo "=== Installing system dependencies ==="
          echo "Installing Xvfb, FUSE, Python 3.11, and diagnostic tools..."
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils imagemagick xterm xdotool libfuse2 procps curl lsof iproute2 \
            software-properties-common python3.11 python3.11-venv python3-pip
          
          # Verify Python 3.11
          python3.11 --version
          
          # Install Python dependencies
          echo "Installing Python dependencies..."
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install -r ../../requirements.txt
          
          echo "=== Pre-seeding setup configuration ==="
          APPIMAGE=$(ls ClippyVision-Linux-*.AppImage 2>/dev/null | head -1)
          chmod +x "$APPIMAGE"
          
          # Pre-seed setup files in expected location
          CONFIG_DIR="$HOME/.config/Clippy Vision/data"
          mkdir -p "$CONFIG_DIR"
          
          # Create setup_complete.json
          cat > "$CONFIG_DIR/setup_complete.json" << 'EOF'
{
  "version": "2.1.0",
  "completedAt": "2026-10-11T17:00:00.000Z"
}
EOF
          
          # Create llm_config.json with stub HTTP endpoint (bypass Ollama requirement)
          cat > "$CONFIG_DIR/llm_config.json" << 'EOF'
{
  "provider": "ollama",
  "base_url": "http://127.0.0.1:11555",
  "api_key": "",
  "chat_model": "test-model",
  "embedding_model": "nomic-embed-text"
}
EOF
          
          # Start stub LLM API server to satisfy preflight checks
          echo "Starting stub LLM API server on port 11555..."
          python3.11 -m http.server 11555 --bind 127.0.0.1 > /dev/null 2>&1 &
          STUB_PID=$!
          sleep 1
          
          # Test stub server
          if curl -s http://127.0.0.1:11555/ > /dev/null; then
            echo "✓ Stub server running on port 11555"
          else
            echo "ERROR: Stub server failed to start"
            exit 1
          fi
          
          # Set CLIPPY_PYTHON to use our installed Python 3.11
          export CLIPPY_PYTHON="python3.11"
          
          echo "=== Starting Xvfb and AppImage ==="
          
          echo "Starting Xvfb on :99..."
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          
          echo "Launching AppImage with CLIPPY_PYTHON=$CLIPPY_PYTHON..."
          LOG_FILE="launch-test.log"
          STDERR_FILE="launch-test.stderr"
          ./"$APPIMAGE" > "$LOG_FILE" 2> "$STDERR_FILE" &
          APP_PID=$!
          
          echo "AppImage PID: $APP_PID"
          echo "Waiting up to 90 seconds for startup..."
          
          # Monitor for 90 seconds, checking for backend HTTP and window
          BACKEND_PORT=""
          BACKEND_HTTP_OK=false
          WINDOW_FOUND=false
          
          for i in {1..90}; do
            # Check if main process still alive
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "ERROR: AppImage crashed after $i seconds"
              echo "=== Crash log ==="
              cat "$LOG_FILE"
              kill $XVFB_PID 2>/dev/null || true
              exit 1
            fi
            
            # Check log for backend port announcement
            if [ -z "$BACKEND_PORT" ]; then
              PORT_LINE=$(grep -o "\[api\] port=[0-9]*" "$LOG_FILE" 2>/dev/null | head -1)
              if [ -n "$PORT_LINE" ]; then
                BACKEND_PORT=$(echo "$PORT_LINE" | grep -o "[0-9]\+")
                if [ -n "$BACKEND_PORT" ]; then
                  echo "✓ Backend port announced: $BACKEND_PORT at ${i}s"
                  
                  # Show diagnostic info when port is announced
                  echo "=== Diagnostics at ${i}s (port announced) ==="
                  echo "--- Listening TCP ports (ss -tlnp) ---"
                  ss -tlnp 2>&1 | grep -E "State|$BACKEND_PORT|127.0.0.1" || echo "(no matches)"
                  echo "--- Python processes (ps -ef | grep python) ---"
                  ps -ef | grep -i python | grep -v grep || echo "(no python processes)"
                  echo "=== End diagnostics ==="
                fi
              fi
            fi
            
            # If port known, try HTTP health check
            if [ -n "$BACKEND_PORT" ] && [ "$BACKEND_HTTP_OK" = false ]; then
              # Try both 127.0.0.1 and localhost
              for host in "127.0.0.1" "localhost"; do
                HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" "http://${host}:${BACKEND_PORT}/health" 2>&1 || echo "")
                HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -1)
                HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
                
                if [ "$HTTP_CODE" = "200" ]; then
                  BACKEND_HTTP_OK=true
                  echo "✓ Backend HTTP responding on ${host}:${BACKEND_PORT} at ${i}s"
                  echo "  Response: $HTTP_BODY"
                  
                  # Show diagnostic info on success
                  echo "=== Diagnostics at ${i}s (HTTP success) ==="
                  echo "--- Listening TCP ports (ss -tlnp) ---"
                  ss -tlnp 2>&1 | grep -E "State|$BACKEND_PORT" || echo "(no matches)"
                  echo "--- Python processes ---"
                  ps -ef | grep -i python | grep -v grep || echo "(no python processes)"
                  echo "=== End diagnostics ==="
                  break
                fi
              done
            fi
            
            # Check for Electron window
            if [ "$WINDOW_FOUND" = false ]; then
              if xdotool search --name "Clippy" > /dev/null 2>&1; then
                WINDOW_FOUND=true
                echo "✓ Electron window detected at ${i}s"
              fi
            fi
            
            # Exit early if all verified
            if [ "$BACKEND_HTTP_OK" = true ] && [ "$WINDOW_FOUND" = true ]; then
              echo "✓ All components verified, continuing monitoring..."
              break
            fi
            
            sleep 1
          done
          
          # Show mid-point diagnostics if backend not responding yet
          if [ "$BACKEND_HTTP_OK" = false ] && [ -n "$BACKEND_PORT" ]; then
            echo "=== Mid-point diagnostics (HTTP not responding after 90s) ==="
            echo "--- Listening TCP ports (ss -tlnp) ---"
            ss -tlnp 2>&1 | head -30
            echo "--- Python processes ---"
            ps -ef | grep -i python | grep -v grep || echo "(no python processes)"
            echo "--- Recent log lines ---"
            tail -20 "$LOG_FILE"
            echo "=== End mid-point diagnostics ==="
          fi
          
          # Continue monitoring to ensure stability (30 more seconds)
          echo "Monitoring stability for 30 more seconds..."
          for i in {1..30}; do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "ERROR: AppImage crashed during stability check"
              cat "$LOG_FILE"
              kill $XVFB_PID 2>/dev/null || true
              exit 1
            fi
            
            # Retry HTTP if not yet successful
            if [ -n "$BACKEND_PORT" ] && [ "$BACKEND_HTTP_OK" = false ]; then
              for host in "127.0.0.1" "localhost"; do
                HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" "http://${host}:${BACKEND_PORT}/health" 2>&1 || echo "")
                HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -1)
                HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
                
                if [ "$HTTP_CODE" = "200" ]; then
                  BACKEND_HTTP_OK=true
                  STABILITY_ELAPSED=$((90 + i))
                  echo "✓ Backend HTTP responding on ${host}:${BACKEND_PORT} at ${STABILITY_ELAPSED}s"
                  echo "  Response: $HTTP_BODY"
                  break
                fi
              done
            fi
            
            sleep 1
          done
          
          echo "✓ AppImage stable for 120 seconds total"
          
          # Final diagnostics
          echo "=== Final diagnostics ==="
          echo "--- All listening TCP ports (ss -tlnp) ---"
          ss -tlnp 2>&1 | head -40
          echo "--- Python processes ---"
          ps -ef | grep -i python | grep -v grep || echo "(no python processes)"
          echo "=== End final diagnostics ==="
          
          # Verify required components started
          if [ -z "$BACKEND_PORT" ]; then
            echo "ERROR: Backend port never announced in log"
            echo "=== Application log ==="
            cat "$LOG_FILE"
            kill $APP_PID 2>/dev/null || true
            kill $XVFB_PID 2>/dev/null || true
            exit 1
          fi
          
          if [ "$BACKEND_HTTP_OK" = false ]; then
            echo "ERROR: Backend HTTP health check never succeeded"
            echo "  Port announced: $BACKEND_PORT"
            echo "  Tried: http://127.0.0.1:${BACKEND_PORT}/health and http://localhost:${BACKEND_PORT}/health"
            echo ""
            echo "=== Setup bypass configuration ==="
            echo "  - setup_complete.json: pre-seeded"
            echo "  - llm_config.json: base_url=http://127.0.0.1:11555 (stub server)"
            echo "  - CLIPPY_PYTHON: $CLIPPY_PYTHON"
            echo "  - Python deps: installed via requirements.txt"
            echo "  - Ollama check: bypassed (external base_url)"
            echo ""
            echo "=== Investigation: Backend bundle and startup ==="
            
            # Check if backend files are in the AppImage
            echo "--- Extracting AppImage to check bundle ---"
            ./"$APPIMAGE" --appimage-extract > /dev/null 2>&1 || true
            if [ -d "squashfs-root" ]; then
              echo "Backend files in bundle:"
              find squashfs-root -name "api_server.py" -o -name "core" -type d | head -5
              echo "Python in bundle:"
              find squashfs-root -name "python*" -type f | head -5
            fi
            
            echo ""
            echo "=== Full application log ==="
            cat "$LOG_FILE"
            
            if [ -f "$STDERR_FILE" ]; then
              echo ""
              echo "=== Backend stderr ==="
              cat "$STDERR_FILE"
            fi
            
            kill $STUB_PID 2>/dev/null || true
            kill $APP_PID 2>/dev/null || true
            kill $XVFB_PID 2>/dev/null || true
            exit 1
          fi
          
          if [ "$WINDOW_FOUND" = false ]; then
            echo "ERROR: Electron window never appeared"
            echo "=== Application log ==="
            cat "$LOG_FILE"
            kill $APP_PID 2>/dev/null || true
            kill $XVFB_PID 2>/dev/null || true
            exit 1
          fi
          
          # Capture screenshot
          echo "Capturing screenshot..."
          import -window root -display :99 launch-screenshot.png 2>/dev/null || \
            echo "Screenshot capture failed (non-critical)"
          
          # Show log excerpt
          echo ""
          echo "=== Launch log excerpt (first 100 lines) ==="
          head -100 "$LOG_FILE"
          echo ""
          echo "=== Launch log excerpt (last 100 lines) ==="
          tail -100 "$LOG_FILE"
          
          # Cleanup
          kill $STUB_PID 2>/dev/null || true
          kill $APP_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          
          echo ""
          echo "✓ Launch test completed successfully"
          echo "  - Backend port: $BACKEND_PORT"
          echo "  - Backend HTTP health check: PASSED (200 OK)"
          echo "  - Electron window: verified"
          echo "  - Stable for 120 seconds"

      - name: Upload launch test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-launch-test
          path: |
            electron-ui/dist/launch-test.log
            electron-ui/dist/launch-test.stderr
            electron-ui/dist/launch-screenshot.png
          retention-days: 14

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: electron-ui/dist/*.AppImage
          retention-days: 14

      - name: Upload Linux AppImage to release
        # Only upload to release if we have a tag (not a dry-run or PR)
        if: (github.event.inputs.tag != '' || github.ref_type == 'tag') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            electron-ui/dist/*.AppImage
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
