name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'electron-ui/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.0.1). Leave empty for dry-run without creating a release.'
        required: false
      include_macos:
        description: 'Also build unsigned macOS installers (opt-in, manual validation required)'
        type: boolean
        default: false
      include_linux:
        description: 'Build Linux AppImage (enabled by default for tag pushes)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Checkout the ref the workflow was triggered on (tag push or dispatch branch),
      # not the release tag input — so workflow_dispatch from main builds current packaging.
      # lfs: true pulls any remaining Git LFS objects. Model weights are downloaded, not committed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Sync app version from release tag or dry-run
        working-directory: electron-ui
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Dry-run: use package.json version with -dev suffix
            TAG="v$(node -p "require('./package.json').version")-dev+${{ github.sha }}"
            echo "::notice::Dry-run build (no release will be created): $TAG"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "Invalid version derived from tag '$TAG' (got '$VERSION')"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building Clippy Vision $VERSION (release tag $TAG)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build Windows installer (unsigned)
        working-directory: electron-ui
        run: npm run dist:win

      - name: Smoke check Windows installer
        shell: bash
        working-directory: electron-ui/dist
        run: |
          echo "Checking Windows installer..."
          INSTALLER=$(ls ClippyVision-Windows-Setup-*.exe 2>/dev/null | head -1)
          if [[ -z "$INSTALLER" ]]; then
            echo "ERROR: No Windows installer found"
            exit 1
          fi
          SIZE=$(stat -c%s "$INSTALLER" 2>/dev/null || stat -f%z "$INSTALLER" 2>/dev/null)
          echo "Found: $INSTALLER (${SIZE} bytes)"
          if [[ $SIZE -lt 50000000 ]]; then
            echo "ERROR: Installer too small (${SIZE} bytes, expected >50MB)"
            exit 1
          fi
          echo "✓ Windows installer OK"

      - name: Silent install test Windows
        shell: pwsh
        working-directory: electron-ui/dist
        run: |
          Write-Host "Running silent installation..."
          $installer = Get-ChildItem -Filter "ClippyVision-Windows-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer found"
            exit 1
          }
          
          Write-Host "Installing: $($installer.Name)"
          $installLog = "install-test.log"
          
          # Run silent install
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -NoNewWindow
          
          Write-Host "Checking installation..."
          $programFiles = ${env:ProgramFiles}
          $installPath = "$programFiles\Clippy Vision"
          $exePath = "$installPath\Clippy Vision.exe"
          
          # Also check local app data (user install)
          $localAppData = ${env:LOCALAPPDATA}
          $localInstallPath = "$localAppData\Programs\Clippy Vision"
          $localExePath = "$localInstallPath\Clippy Vision.exe"
          
          $installedExe = $null
          $installLocation = ""
          if (Test-Path $exePath) {
            $installedExe = $exePath
            $installLocation = "Program Files"
            Write-Host "✓ Installation successful (Program Files): $exePath"
          } elseif (Test-Path $localExePath) {
            $installedExe = $localExePath
            $installLocation = "LocalAppData\Programs"
            Write-Host "✓ Installation successful (LocalAppData\Programs): $localExePath"
          } else {
            Write-Error "Installation failed - executable not found at either location:"
            Write-Error "  - $exePath"
            Write-Error "  - $localExePath"
            "Installation failed - exe not found" | Out-File $installLog
            exit 1
          }
          
          $exeSize = (Get-Item $installedExe).Length
          Write-Host "  Installed exe size: $exeSize bytes"
          Write-Host "  Install location: $installLocation"
          
          # Launch test (30 seconds)
          Write-Host "Launching application (30 second test)..."
          $process = Start-Process -FilePath $installedExe -PassThru -WindowStyle Hidden -ErrorAction Stop
          
          if (-not $process) {
            Write-Error "Failed to start process"
            "Launch failed" | Out-File $installLog
            exit 1
          }
          
          Write-Host "  Main process PID: $($process.Id)"
          
          # Monitor for 30 seconds
          $backendFound = $false
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 1
            
            # Check if main process exited
            if ($process.HasExited) {
              Write-Error "Process exited after $i seconds (exit code: $($process.ExitCode))"
              "Process crashed after ${i}s (code: $($process.ExitCode))" | Out-File $installLog
              exit 1
            }
            
            # Check for Python backend process
            if (-not $backendFound) {
              $pythonProcs = Get-Process -Name python* -ErrorAction SilentlyContinue | Where-Object {
                $_.Parent.Id -eq $process.Id -or $_.CommandLine -like "*api_server*"
              }
              if ($pythonProcs) {
                Write-Host "✓ Python backend process detected at ${i}s"
                $backendFound = $true
              }
            }
          }
          
          Write-Host "✓ Process still running after 30 seconds"
          
          if (-not $backendFound) {
            Write-Warning "Python backend process not detected (may be in different process tree)"
          }
          
          # Cleanup
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          
          # Write summary
          "Installation: $installLocation" | Out-File $installLog
          "Process ran for 30 seconds" | Out-File $installLog -Append
          if ($backendFound) {
            "Backend process detected" | Out-File $installLog -Append
          }
          
          Write-Host ""
          Write-Host "✓ Silent install test completed"
          Write-Host "  - Installed to: $installLocation"
          Write-Host "  - Process stable for 30s"
          Write-Host "  - Backend process: $(if ($backendFound) { 'detected' } else { 'not detected' })"

      - name: Upload Windows test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-test
          path: |
            electron-ui/dist/install-test.log
          retention-days: 14

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron-ui/dist/*.exe
          retention-days: 14

      - name: Upload Windows installer to release
        # Only upload to release if we have a tag (not a dry-run or PR)
        if: (github.event.inputs.tag != '' || github.ref_type == 'tag') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            electron-ui/dist/*.exe
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opt-in only. Tag pushes never build or publish macOS installers.
  build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Sync app version from release tag or dry-run
        working-directory: electron-ui
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            # Dry-run: use package.json version with -dev suffix
            TAG="v$(node -p "require('./package.json').version")-dev+${{ github.sha }}"
            echo "::notice::Dry-run build (no release will be created): $TAG"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "Invalid version derived from tag '$TAG' (got '$VERSION')"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building Clippy Vision $VERSION (release tag $TAG)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build macOS installer (unsigned, code signing disabled)
        working-directory: electron-ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload macOS installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: electron-ui/dist/*.dmg
          retention-days: 14

      - name: Upload macOS installers to release
        # Only upload to release if we have a tag (not a dry-run or PR)
        if: github.event.inputs.tag != '' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            electron-ui/dist/*.dmg
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    # Run on tag pushes, PRs (dry-run), or on workflow_dispatch if include_linux is true (default)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.include_linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: electron-ui
        run: npm ci

      - name: Sync app version from release tag or dry-run
        working-directory: electron-ui
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Dry-run: use package.json version with -dev suffix
            TAG="v$(node -p "require('./package.json').version")-dev+${{ github.sha }}"
            echo "::notice::Dry-run build (no release will be created): $TAG"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "Invalid version derived from tag '$TAG' (got '$VERSION')"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building Clippy Vision $VERSION (release tag $TAG)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build Linux AppImage (unsigned)
        working-directory: electron-ui
        run: npm run dist:linux

      - name: Smoke check Linux AppImage
        working-directory: electron-ui/dist
        run: |
          echo "Checking Linux AppImage..."
          APPIMAGE=$(ls ClippyVision-Linux-*.AppImage 2>/dev/null | head -1)
          if [[ -z "$APPIMAGE" ]]; then
            echo "ERROR: No AppImage found"
            exit 1
          fi
          SIZE=$(stat -c%s "$APPIMAGE")
          echo "Found: $APPIMAGE (${SIZE} bytes)"
          if [[ $SIZE -lt 50000000 ]]; then
            echo "ERROR: AppImage too small (${SIZE} bytes, expected >50MB)"
            exit 1
          fi
          
          # Extract and verify main binary exists
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract >/dev/null 2>&1
          
          if [[ ! -f "squashfs-root/clippy-vision" ]] && [[ ! -f "squashfs-root/AppRun" ]]; then
            echo "ERROR: Main binary not found in extracted AppImage"
            ls -la squashfs-root/ || true
            exit 1
          fi
          
          echo "✓ AppImage structure OK"
          rm -rf squashfs-root

      - name: Launch test Linux AppImage under Xvfb
        working-directory: electron-ui/dist
        run: |
          echo "Installing Xvfb, FUSE, and screenshot tools..."
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils imagemagick xterm xdotool libfuse2 procps curl
          
          APPIMAGE=$(ls ClippyVision-Linux-*.AppImage 2>/dev/null | head -1)
          chmod +x "$APPIMAGE"
          
          echo "Starting Xvfb on :99..."
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          
          echo "Launching AppImage..."
          LOG_FILE="launch-test.log"
          ./"$APPIMAGE" > "$LOG_FILE" 2>&1 &
          APP_PID=$!
          
          echo "AppImage PID: $APP_PID"
          echo "Waiting up to 90 seconds for startup..."
          
          # Monitor for 90 seconds, checking for backend and window
          BACKEND_FOUND=false
          WINDOW_FOUND=false
          
          for i in {1..90}; do
            # Check if main process still alive
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "ERROR: AppImage crashed after $i seconds"
              echo "=== Crash log ==="
              cat "$LOG_FILE"
              kill $XVFB_PID 2>/dev/null || true
              exit 1
            fi
            
            # Check for Python backend process
            if [ "$BACKEND_FOUND" = false ]; then
              if pgrep -f "python.*api_server" > /dev/null 2>&1; then
                BACKEND_FOUND=true
                echo "✓ Python backend process detected at ${i}s"
              fi
            fi
            
            # Check for backend port listening (try common ports)
            if [ "$BACKEND_FOUND" = true ]; then
              if grep -q "CLIPPY_API_PORT" "$LOG_FILE" 2>/dev/null; then
                API_PORT=$(grep -o "CLIPPY_API_PORT.*" "$LOG_FILE" | head -1 | grep -o "[0-9]\+" | head -1)
                if [ -n "$API_PORT" ]; then
                  if curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$API_PORT/health" 2>/dev/null | grep -q "200"; then
                    echo "✓ Backend health endpoint responding on port $API_PORT at ${i}s"
                  fi
                fi
              fi
            fi
            
            # Check for Electron window
            if [ "$WINDOW_FOUND" = false ]; then
              if xdotool search --name "Clippy" > /dev/null 2>&1; then
                WINDOW_FOUND=true
                echo "✓ Electron window detected at ${i}s"
              fi
            fi
            
            # Exit early if both verified
            if [ "$BACKEND_FOUND" = true ] && [ "$WINDOW_FOUND" = true ]; then
              echo "✓ Both backend and window verified, continuing monitoring..."
              break
            fi
            
            sleep 1
          done
          
          # Continue monitoring to ensure stability (30 more seconds)
          echo "Monitoring stability for 30 more seconds..."
          for i in {1..30}; do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "ERROR: AppImage crashed during stability check"
              cat "$LOG_FILE"
              kill $XVFB_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          
          echo "✓ AppImage stable for 120 seconds total"
          
          # Verify required components started
          if [ "$BACKEND_FOUND" = false ]; then
            echo "ERROR: Python backend process never detected"
            echo "=== Application log ==="
            cat "$LOG_FILE"
            kill $APP_PID 2>/dev/null || true
            kill $XVFB_PID 2>/dev/null || true
            exit 1
          fi
          
          if [ "$WINDOW_FOUND" = false ]; then
            echo "ERROR: Electron window never appeared"
            echo "=== Application log ==="
            cat "$LOG_FILE"
            kill $APP_PID 2>/dev/null || true
            kill $XVFB_PID 2>/dev/null || true
            exit 1
          fi
          
          # Capture screenshot
          echo "Capturing screenshot..."
          import -window root -display :99 launch-screenshot.png 2>/dev/null || \
            echo "Screenshot capture failed (non-critical)"
          
          # Show log excerpt
          echo ""
          echo "=== Launch log excerpt (first 100 lines) ==="
          head -100 "$LOG_FILE"
          echo ""
          echo "=== Launch log excerpt (last 100 lines) ==="
          tail -100 "$LOG_FILE"
          
          # Cleanup
          kill $APP_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          
          echo ""
          echo "✓ Launch test completed successfully"
          echo "  - Backend process verified"
          echo "  - Electron window verified"
          echo "  - Stable for 120 seconds"

      - name: Upload launch test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-launch-test
          path: |
            electron-ui/dist/launch-test.log
            electron-ui/dist/launch-screenshot.png
          retention-days: 14

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: electron-ui/dist/*.AppImage
          retention-days: 14

      - name: Upload Linux AppImage to release
        # Only upload to release if we have a tag (not a dry-run or PR)
        if: (github.event.inputs.tag != '' || github.ref_type == 'tag') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            electron-ui/dist/*.AppImage
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
